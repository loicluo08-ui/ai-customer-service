<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI客服 · 行业智能问答</title>
<style>
:root {
  --primary: #20B2AA;
  --primary-light: #48D1CC;
  --primary-bg: #F0FBFA;
  --primary-soft: #E0F5F3;
  --text: #2D3436;
  --text-2: #636E72;
  --text-3: #B2BEC3;
  --border: #ECF0F1;
  --surface: #FFFFFF;
  --surface-2: #F8F9FA;
  --bubble-user: #20B2AA;
  --bubble-ai: #FFFFFF;
  --bubble-ai-border: #E8ECEF;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 1px 3px rgba(0,0,0,0.05);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
  --max-width: 460px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

body[data-industry="edu"] {
  --primary: #F58634;
  --primary-light: #F9A55A;
  --primary-bg: #FFF8F0;
  --primary-soft: #FFE8D1;
  --bubble-user: #F58634;
}

body[data-industry="gym"] {
  --primary: #3B82F6;
  --primary-light: #60A5FA;
  --primary-bg: #EFF6FF;
  --primary-soft: #DBEAFE;
  --bubble-user: #3B82F6;
}

body[data-industry="hair"] {
  --primary: #D6367F;
  --primary-light: #E85A9C;
  --primary-bg: #FDF2F8;
  --primary-soft: #FCE4EC;
  --bubble-user: #D6367F;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background: var(--surface-2);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
}

.app {
  width: 100%;
  max-width: var(--max-width);
  background: var(--surface);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: 0 0 40px rgba(0,0,0,0.04);
}

/* === 顶部栏 === */
.header {
  padding: 14px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 10;
  padding-top: max(14px, env(safe-area-inset-top));
}

.header-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--primary-soft);
  display: grid;
  place-items: center;
  font-size: 18px;
  flex-shrink: 0;
}

.header-info { flex: 1; min-width: 0; }

.header-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 6px;
}

.verified-badge {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-size: 10px;
  background: #E8F5E9;
  color: #2E7D32;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 500;
}

.verified-badge svg { width: 10px; height: 10px; }

.header-status {
  font-size: 11px;
  color: var(--text-3);
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 2px;
}

.header-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #4CAF50;
  flex-shrink: 0;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.header-switch {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
}

.header-switch:hover { background: var(--surface-2); }
.header-switch svg { width: 16px; height: 16px; color: var(--text-2); }

/* === 行业选择抽屉（fixed 定位，适配刘海屏与居中布局） === */
.industry-drawer {
  position: fixed;
  top: calc(62px + env(safe-area-inset-top, 0px));
  right: max(16px, calc(50% - var(--max-width) / 2 + 16px));
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  padding: 6px;
  z-index: 20;
  display: none;
  min-width: 200px;
  border: 1px solid var(--border);
}

.industry-drawer.open { display: block; animation: dropIn 0.2s ease; }

@keyframes dropIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

.industry-option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.15s;
}

.industry-option:hover { background: var(--surface-2); }
.industry-option.active { background: var(--primary-bg); }
.industry-option-icon { font-size: 18px; }
.industry-option-text { font-size: 13px; font-weight: 500; }

.drawer-divider {
  height: 1px;
  background: var(--border);
  margin: 4px 8px;
}

.drawer-cta { color: var(--primary); }
.drawer-cta .industry-option-text { font-weight: 600; }

/* === 信任栏（数字化） === */
.trust-bar {
  padding: 8px 20px;
  background: var(--primary-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  font-size: 11px;
  color: var(--text-2);
  border-bottom: 1px solid var(--border);
}

.trust-item {
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}

.trust-item strong { color: var(--text); font-weight: 600; }
.trust-item svg { width: 12px; height: 12px; color: var(--primary); }

/* === 消息区 === */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  -webkit-overflow-scrolling: touch;
}

.messages::-webkit-scrollbar { width: 3px; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* === 欢迎状态 === */
.welcome {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  text-align: center;
}

.welcome-icon {
  width: 64px;
  height: 64px;
  border-radius: 20px;
  background: var(--primary-soft);
  display: grid;
  place-items: center;
  font-size: 32px;
  margin-bottom: 16px;
}

.welcome-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 8px;
  letter-spacing: -0.2px;
}

.welcome-desc {
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.6;
  margin-bottom: 24px;
  max-width: 280px;
}

.welcome-suggestions {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.suggestion-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  cursor: pointer;
  transition: all 0.2s;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 10px;
  -webkit-tap-highlight-color: transparent;
}

.suggestion-card:hover {
  border-color: var(--primary);
  background: var(--primary-bg);
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}

.suggestion-card:active { transform: scale(0.98); }

.suggestion-emoji { font-size: 20px; flex-shrink: 0; }
.suggestion-text { flex: 1; }
.suggestion-title { font-size: 13px; font-weight: 500; }
.suggestion-desc { font-size: 11px; color: var(--text-3); margin-top: 1px; }

.welcome-footer {
  margin-top: 24px;
  font-size: 11px;
  color: var(--text-3);
  display: flex;
  align-items: center;
  gap: 4px;
}

.welcome-footer svg { width: 11px; height: 11px; }

/* === 消息气泡 === */
.msg {
  display: flex;
  gap: 8px;
  max-width: 85%;
  animation: msgIn 0.3s ease;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg.user { align-self: flex-end; flex-direction: row-reverse; }

.msg-avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
}

.msg.ai .msg-avatar { background: var(--primary-soft); }
.msg.user .msg-avatar { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; }

.msg-content { min-width: 0; }

.msg-bubble {
  padding: 10px 14px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.75;
  word-break: break-word;
}

.msg.ai .msg-bubble {
  background: var(--bubble-ai);
  border: 1px solid var(--bubble-ai-border);
  border-top-left-radius: 4px;
}

.msg.user .msg-bubble {
  background: linear-gradient(135deg, var(--bubble-user), var(--primary-light));
  color: white;
  border-top-right-radius: 4px;
}

.msg-time {
  font-size: 10px;
  color: var(--text-3);
  margin-top: 4px;
}

.msg.user .msg-time { text-align: right; }

/* === 来源引用 === */
.msg-source {
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px solid var(--border);
  font-size: 10px;
  color: var(--text-3);
  display: flex;
  align-items: center;
  gap: 3px;
}

.msg-source svg { width: 11px; height: 11px; flex-shrink: 0; }

/* === 转化卡片 === */
.cta-card {
  margin-top: 8px;
  background: linear-gradient(135deg, var(--primary-bg), var(--primary-soft));
  border: 1px solid var(--primary-soft);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
}

.cta-card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}

.cta-card-desc {
  font-size: 12px;
  color: var(--text-2);
  line-height: 1.6;
  margin-bottom: 8px;
}

.cta-card-btn {
  display: inline-block;
  padding: 6px 14px;
  border-radius: 16px;
  background: var(--primary);
  color: #fff;
  font-size: 12px;
  font-weight: 500;
  border: none;
  cursor: pointer;
  transition: all 0.2s;
}

.cta-card-btn:hover { transform: scale(1.03); }
.cta-card-btn:active { transform: scale(0.97); }

/* === 留资表单 === */
.lead-input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  margin-bottom: 8px;
  background: var(--surface);
  transition: border-color 0.2s;
}

.lead-input:focus { border-color: var(--primary); }

.lead-success {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: #2E7D32;
  font-weight: 500;
  padding: 4px 0;
}

.lead-success svg { width: 16px; height: 16px; flex-shrink: 0; }

/* === 反馈按钮 === */
.msg-feedback {
  margin-top: 6px;
  display: flex;
  gap: 6px;
}

.fb-btn {
  padding: 3px 10px;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--text-2);
}

.fb-btn:hover { border-color: var(--primary); color: var(--primary); }
.fb-btn.clicked { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }

/* === 快捷回复（横向滚动） === */
.quick-replies {
  padding: 6px 20px 4px;
  display: flex;
  gap: 6px;
  flex-wrap: nowrap;
  overflow-x: auto;
  transition: all 0.3s;
  scrollbar-width: none;
}

.quick-replies::-webkit-scrollbar { display: none; }
.quick-replies.hidden { display: none; }

.quick-reply {
  padding: 6px 12px;
  border-radius: 16px;
  border: 1px solid var(--primary);
  background: var(--surface);
  color: var(--primary);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}

.quick-reply:hover { background: var(--primary); color: white; }
.quick-reply:active { transform: scale(0.96); }

/* === 加载动画 === */
.typing {
  display: flex;
  gap: 4px;
  padding: 3px 0;
}

.typing span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-3);
  animation: typingDot 1.2s infinite;
}

.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingDot {
  0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
  30% { opacity: 1; transform: scale(1); }
}

/* 打字光标 */
.typing-cursor {
  display: inline-block;
  width: 2px;
  height: 14px;
  background: var(--primary);
  vertical-align: -2px;
  margin-left: 2px;
  animation: cursorBlink 0.8s infinite;
}

@keyframes cursorBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* === 持久CTA栏 === */
.persistent-cta {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: linear-gradient(135deg, var(--primary-bg), var(--primary-soft));
  border-top: 1px solid var(--primary-soft);
  font-size: 12px;
  color: var(--text);
}
.persistent-cta-text { flex: 1; min-width: 0; }
.persistent-cta-text strong { color: var(--primary); font-weight: 600; }
.persistent-cta-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 12px;
  border-radius: 14px;
  background: var(--primary);
  color: #fff;
  font-size: 11px;
  font-weight: 500;
  border: none;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  flex-shrink: 0;
}
.persistent-cta-btn:hover { transform: scale(1.03); }
.persistent-cta-btn:active { transform: scale(0.97); }
.persistent-cta-btn svg { width: 12px; height: 12px; }

/* === 底部区 === */
.bottom-area {
  border-top: 1px solid var(--border);
  background: var(--surface);
  padding-bottom: var(--safe-bottom);
}

/* === 转人工 === */
.human-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 7px;
  margin: 8px 20px 0;
  border-radius: var(--radius-sm);
  border: 1px dashed var(--border);
  color: var(--text-2);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: transparent;
  width: calc(100% - 40px);
}

.human-btn:hover { border-color: var(--primary); color: var(--primary); border-style: solid; background: var(--primary-bg); }
.human-btn svg { width: 13px; height: 13px; }

/* === 输入区 === */
.input-area {
  padding: 10px 20px 12px;
}

.input-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

.input-box {
  flex: 1;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 9px 14px;
  font-size: 14px;
  font-family: inherit;
  resize: none;
  outline: none;
  transition: border-color 0.2s;
  max-height: 90px;
  line-height: 1.5;
  background: var(--surface-2);
}

.input-box:focus { border-color: var(--primary); background: var(--surface); }

.send-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  border: none;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
}

.send-btn:hover { transform: scale(1.05); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.send-btn svg { width: 16px; height: 16px; color: white; }

.input-hint {
  text-align: center;
  font-size: 10px;
  color: var(--text-3);
  margin-top: 6px;
}

/* === 移动端 === */
@media (max-width: 500px) {
  .app { box-shadow: none; }
  .messages { padding: 16px; }
  .input-area { padding: 8px 16px 10px; }
  .quick-replies { padding: 6px 16px 4px; }
  .human-btn { margin: 8px 16px 0; width: calc(100% - 32px); }
  .trust-bar { padding: 8px 16px; gap: 10px; font-size: 10px; }
  .persistent-cta { padding: 7px 12px; font-size: 11px; gap: 6px; }
  .persistent-cta-btn { padding: 4px 10px; font-size: 10px; }
}
</style>
</head>
<body data-industry="pet">

<div class="app">
  <!-- 顶部栏 -->
  <div class="header">
    <div class="header-avatar" id="avatar">🐕</div>
    <div class="header-info">
      <div class="header-name" id="brandName">
        宠安AI · 智能客服
        <span class="verified-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>
          已认证
        </span>
      </div>
      <div class="header-status">
        <span class="header-dot"></span>
        <span>在线 · 通常30秒内回复</span>
      </div>
    </div>
    <button class="header-switch" onclick="toggleDrawer()" aria-label="切换行业">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
  </div>

  <!-- 信任栏（真实数据） -->
  <div class="trust-bar">
    <div class="trust-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L3 7v6c0 5 3.5 9 9 11 5.5-2 9-6 9-11V7l-9-5z"/></svg>
      <strong>4</strong> 行业模板
    </div>
    <div class="trust-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <strong>129+</strong> 条真实Q&A
    </div>
    <div class="trust-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z"/></svg>
      可定制<strong>专属</strong>客服
    </div>
  </div>

  <!-- 行业选择 -->
  <div class="industry-drawer" id="drawer">
    <div class="industry-option active" data-key="pet" onclick="switchIndustry('pet')">
      <span class="industry-option-icon">🐕</span>
      <span class="industry-option-text">宠物医院</span>
    </div>
    <div class="industry-option" data-key="edu" onclick="switchIndustry('edu')">
      <span class="industry-option-icon">📚</span>
      <span class="industry-option-text">教培机构</span>
    </div>
    <div class="industry-option" data-key="gym" onclick="switchIndustry('gym')">
      <span class="industry-option-icon">💪</span>
      <span class="industry-option-text">健身工作室</span>
    </div>
    <div class="industry-option" data-key="hair" onclick="switchIndustry('hair')">
      <span class="industry-option-icon">✂️</span>
      <span class="industry-option-text">美发沙龙</span>
    </div>
    <div class="drawer-divider"></div>
    <div class="industry-option drawer-cta" onclick="askOtherIndustry()">
      <span class="industry-option-icon">🏪</span>
      <span class="industry-option-text">我的行业不在里面？</span>
    </div>
  </div>

  <!-- 消息区 -->
  <div class="messages" id="messages"></div>

  <!-- 底部区 -->
  <div class="bottom-area">
    <!-- 持久CTA栏：始终可见 -->
    <div class="persistent-cta">
      <div class="persistent-cta-text">想让你店也有？加微信 <strong>15159510967</strong></div>
      <button class="persistent-cta-btn" onclick="copyWechat()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/></svg>
        复制微信号
      </button>
    </div>

      { keys: ['眼睛', '眼屎', '流泪', '红眼'], text: '眼部问题：\n\n常见症状：\n• 眼屎增多：可能上火或轻度感染\n• 流泪不止：可能鼻泪管堵塞\n• 眼睛红肿：可能结膜炎\n• 眯眼怕光：可能角膜损伤\n\n🏠 轻微眼屎：\n• 用生理盐水棉球擦拭\n• 注意饮食清淡\n\n⚠️ 需就医：\n• 黄绿色脓性分泌物\n• 眼睛红肿\n• 频繁抓挠眼睛\n• 突然眯眼/怕光\n\n短鼻犬（巴哥/法斗）和波斯猫易发眼部问题，建议定期检查。', source: '宠物医院知识库' },

      { keys: ['消毒', '灭菌', '卫生'], text: '医院消毒标准：\n\n• 诊室每诊次消毒\n• 手术室术前术后紫外线+化学消毒\n• 器械高温高压灭菌\n• 地面/台面每日3次消毒\n• 医疗废弃物分类处理\n\n我们使用的是动物医院专用消毒剂（戊二醛/过硫酸氢钾），对宠物安全且有效杀灭细小病毒、猫瘟病毒等。\n\n住院区域每日清洁消毒，每个笼位使用前后均单独消毒。', source: '宠物医院知识库' },
      { keys: ['住院', '寄养', '留观'], text: '住院/寄养服务：\n\n🏥 住院：\n• 术后留观：100-200元/天\n• 重症监护：200-400元/天\n• 含基础护理和用药\n• 每日医生查房2次\n• 可远程视频探视\n\n🏠 寄养：\n• 需提前预约\n• 要求疫苗完整（三针+狂犬）\n• 自带粮食（避免换粮不适）\n• 价格：80-150元/天\n• 提供每日照片/视频更新\n\n⚠️ 传染病患病宠物需隔离住院，费用另计。', source: '宠物医院知识库' },
      { keys: ['_microchip', '芯片', '登记', '狗证'], text: '宠物登记/芯片：\n\n📋 深圳犬只登记：\n• 必须植入芯片并办理狗证\n• 费用：芯片植入100-200元\n• 狗证免费（深圳政策）\n• 需提供：身份证+房产证/租赁合同+疫苗本\n\n🐱 猫咪芯片：\n• 非强制但建议植入\n• 走丢后便于找回\n• 费用：100-200元\n\n芯片植入过程：\n• 注射器植入皮下（颈部）\n• 无需麻醉\n• 1分钟完成\n• 可在体检/绝育时一并完成', source: '宠物医院知识库' },
      { keys: ['营养', '吃什么', '粮食', '猫粮', '狗粮', '饮食'], text: '宠物营养建议：\n\n🐶 狗狗：\n• 幼犬（2-6月）：每天3-4餐\n• 成犬（6月+）：每天2餐\n• 老年犬（7岁+）：每天2-3餐，低脂高纤维\n\n🐱 猫咪：\n• 幼猫（2-6月）：每天3-4餐\n• 成猫（6月+）：每天2-3餐\n• 老年猫（10岁+）：每天3-4小餐\n\n选粮建议：\n• 看配料表第一位是否为肉类\n• 粗蛋白≥30%（猫）/≥25%（狗）\n• 避免含BHA/BHT防腐剂\n• 换粮需7-10天过渡期\n\n⚠️ 禁忌食物：\n• 巧克力/葡萄/洋葱/大蒜\n• 木糖醇\n• 鸡骨头（易碎裂刺伤）', source: '宠物医院知识库' },
      { keys: ['保险', '理赔'], text: '宠物保险：\n\n常见类型：\n• 意外险：100-300元/年\n• 疾病险：500-1500元/年\n• 综合险：800-2000元/年\n\n理赔流程：\n1. 就诊时告知有宠物保险\n2. 保留病历/发票/检查报告\n3. 48小时内向保险公司报案\n4. 提交理赔材料\n5. 审核7-15个工作日\n\n报销比例：\n• 通常60%-80%\n• 有免赔额（200-500元）\n• 既往症通常不赔\n\n建议：幼年宠物投保最划算，保费低保额高。', source: '宠物医院知识库' },
      { keys: ['疫苗本', '绿本', '免疫证'], text: '疫苗本/免疫证明：\n\n• 首次接种时发放疫苗本（绿色小本）\n• 每次接种记录疫苗批号、日期、医生签名\n• 狗证办理必须提供疫苗本\n• 寄养/住院/出行均需出示\n\n如果丢失：\n• 可到医院补办\n• 需提供宠物信息和接种记录\n• 费用：10-20元\n\n建议拍照备份疫苗本，随身备查。', source: '宠物医院知识库' },
      { keys: ['洗澡', '美容', '修毛'], text: '洗澡/美容服务：\n\n🛁 洗澡：\n• 小型犬：60-100元\n• 中型犬：100-150元\n• 大型犬：150-250元\n• 猫咪：80-150元\n• 含洗澡/吹干/基础梳理/指甲修剪/耳道清洁\n\n✂️ 美容（剪毛造型）：\n• 小型犬：150-300元\n• 中大型犬：250-500元\n• 含洗澡+全套造型\n\n注意事项：\n• 疫苗未打完的幼宠不建议洗澡\n• 术前/术后/生病期间不要洗澡\n• 猫咪洗澡需提前预约\n• 建议每2-4周洗一次', source: '宠物医院知识库' },
      { keys: ['驱蚊', '蚊香', '杀虫剂', '中毒', '误食'], text: '中毒/误食急救：\n\n常见毒物：\n• 蚊香/杀虫剂（菊酯类对猫剧毒）\n• 巧克力/葡萄/木糖醇\n• 百合花（猫致死）\n• 老鼠药\n• 人用药物（布洛芬等）\n\n🚨 急救步骤：\n1. 立即移离毒物来源\n2. 记录误食时间、种类、量\n3. 不要催吐（腐蚀性物质催吐会造成二次伤害）\n4. 带上毒物包装/残留物立即就医\n5. 电话通知急诊热线准备解毒\n\n⚠️ 猫对菊酯类（蚊香/杀虫剂）极度敏感，即使少量也可能致命。\n\n如发现误食，不要等待症状出现，立即就医。', source: '宠物医院知识库' },
      { keys: ['老年', '老年犬', '老年猫', '关节', '肾'], text: '老年宠物护理：\n\n🐶 老年犬（7岁+）：\n• 每半年体检一次\n• 关注关节问题（跛行/起身困难）\n• 关注心脏（咳嗽/运动不耐受）\n• 体重管理\n• 适当补充关节保健品\n\n🐱 老年猫（10岁+）：\n• 每半年体检+血液检查\n• 高发慢性肾病（多饮多尿/消瘦）\n• 高发甲亢（消瘦/多食/烦躁）\n• 关注口腔健康\n\n营养建议：\n• 低磷低钠饮食（肾脏负担）\n• 易消化蛋白质\n• 适当补充omega-3\n\n老年宠物生活质量评估：\n• 食欲/饮水量\n• 运动意愿\n• 精神状态\n• 疼痛信号', source: '宠物医院知识库' },
      { keys: ['发烧', '发热', '体温'], text: '宠物体温：\n\n正常体温：\n• 狗：37.5-39.2℃\n• 猫：38.0-39.5℃\n• 超过39.5℃为发热\n\n测量方法：\n• 肛温计（最准确）：涂润滑后插入2cm，等待1分钟\n• 耳温枪：快速但需专用宠物耳温枪\n• 体表温度不可靠\n\n发烧可能原因：\n• 感染（细菌/病毒）\n• 炎症\n• 中暑\n• 免疫反应（疫苗后24-48小时低烧正常）\n\n处理：\n• 体温<40℃：物理降温+观察\n• 体温>40℃或持续不退：立即就医\n• 不要给人用退烧药（对宠物可能有毒）\n• 中暑需立即用凉水降温并紧急就医', source: '宠物医院知识库' },
      { keys: ['怀孕', '生产', '生育', '幼崽'], text: '宠物怀孕/生产：\n\n📋 怀孕期：\n• 狗：约63天\n• 猫：约65天\n\n产前准备：\n• 准备安静温暖的产房\n• 产前1周减少运动\n• 备好干净毛巾和碘伏\n\n生产征兆：\n• 产前24小时体温下降1℃\n• 烦躁不安/做窝行为\n• 食欲下降\n\n正常生产：\n• 每只幼崽间隔30分钟-2小时\n• 母亲会自行咬断脐带舔舐幼崽\n\n⚠️ 需就医：\n• 强烈宫缩超过30分钟无产出\n• 超过预产期3天以上\n• 大量出血\n• 幼崽卡住\n• 母亲极度虚弱\n\n建议：非繁殖需求建议尽早绝育，减少子宫蓄脓和乳腺肿瘤风险。', source: '宠物医院知识库' },
      { keys: ['脱敏', '训练', '行为', '社会化'], text: '行为问题建议：\n\n🐕 狗狗：\n• 社会化黄金期：3-14周\n• 幼犬班：4-6月龄参加最佳\n• 常见问题：扑人/拆家/叫\n• 建议：每天15分钟训练+充足运动\n\n🐱 猫咪：\n• 乱尿：可能是猫砂盆问题/应激/泌尿疾病\n• 乱抓：提供猫抓板+定期剪指甲\n• 攻击行为：排查疼痛/恐惧/领地\n\n专业建议：\n• 行为问题先排除身体疾病\n• 正向强化训练>惩罚\n• 持续性是关键\n• 严重行为问题建议咨询专业训练师\n\n我们可推荐合作的宠物训练师。', source: '宠物医院知识库' },
      { keys: ['急诊', '半夜', '夜间', '紧急', '急症', '不舒服', '分诊'], text: '夜间急诊智能分诊：\n\n🚨 红色区域——立即就医，不要等待：\n• 呼吸困难/张嘴呼吸/喘不上气\n• 误食异物（巧克力/百合/老鼠药等）\n• 大量出血/止不住血\n• 持续抽搐/全身抽搐\n• 休克/牙龈发白/体温异常\n• 公猫尿不出/频繁蹲猫砂无尿（尿道阻塞可致死）\n• 车祸/高处坠落/被咬伤（可能内出血）\n• 难产/生产超数小时无进展\n• 术后大量渗血/术后不醒\n\n🟡 黄色区域——AI先追问再判断：\n• 呕吐：问频率/持续时间/有无异物→持续超3次或带血立即就医\n• 腹泻：问便便形态/有无血丝→带血或持续超24小时就医\n• 不吃东西：问持续时间/精神状态→超48小时或伴其他症状就医\n• 单次抽搐：问细节/恢复情况→反复发作立即就医\n• 眼部问题：问是否外伤/分泌物→伴随疼痛就医\n• 跛行：问是否有外伤/疼痛程度→伴发热就医\n\n🟢 绿色区域——AI可直接处理：\n• 夜间是否营业/地址/路线\n• 夜间急诊挂号费/加价规则\n• 驱虫/疫苗预约\n• 慢性用药取药时间\n• 术后恢复期一般性指导\n• 皮肤问题/轻微咳嗽→观察建议+预约白班\n\n深圳24小时急诊医院：\n• 瑞派深圳中心24小时医院（五星级）\n• 新瑞鹏集团罗湖转诊中心\n• 祥兽宠物医院（南山区工业七路16号）\n\n如不确定是否紧急，请先描述宠物症状，我帮您判断。', source: '宠物医院知识库·夜间急诊分诊' },
      { keys: ['投诉', '维权', '纠纷', '举报', '12315', '态度差', '差评'], text: '投诉处理指引：\n\n📋 常见6类投诉及处理：\n\n1. 价格相关争议（约30%投诉）：\n• 同药不同价/不明码标价/事后报价\n→ 处理：引导查看价目表，治疗前预估费用范围\n\n2. 诊疗方案分歧/过度医疗：\n• 检查项目必要性存疑/低价引流后加价\n→ 处理：逐项说明检查必要性，留存知情同意记录\n\n3. 资质与误诊争议：\n• 执业资质存疑/挂名接诊/诊断分歧\n→ 处理：引导查验执业兽医资格证，建议第三方调解\n\n4. 术后护理与医疗事故：\n• 术后并发症归属/鉴定难/举证困难\n→ 处理：不回避责任，引导医疗事故鉴定机构\n\n5. 药品安全争议：\n• 人药兽用/药品来源/处方透明度\n→ 处理：引导咨询兽医师，不自行承诺\n\n6. 服务流程争议：\n• 预约困难/等待长/投诉渠道不足\n→ 处理：记录反馈，优化流程\n\n📞 维权渠道：\n• 机构负责人投诉电话\n• 12315消费者投诉\n• 农业农村局（诊疗行为监管）\n• 市场监管局（价格违法）\n\n⚠️ 投诉处理原则：\n• 不回避责任，不承认或否认医疗过错\n• 24小时内回应，3个工作日给方案\n• 争议案件建议第三方调解', source: '宠物医院知识库·投诉框架' },
      { keys: ['医保', '人药', '人用药', '替代', '刷医保', '社保', '人药兽用'], text: '人药兽用与医保问题：\n\n⚖️ 法律边界：\n• 《兽药管理条例》第41条第4款明令禁止人药兽用\n• 2024年宠物医院行政处罚中，资质不全/药品滥用/设备违规占比82%\n• "人药兽用"案件同比增长34%\n\n⚠️ 现实矛盾：\n• 国内获批宠物专用药品种有限（如宠物专用胰岛素0种）\n• 老年宠物肿瘤/慢性病治疗缺乏替代药\n• 部分省市已出台"轻微不罚"清单\n\n🚫 客服不能做什么：\n• 不得承诺使用"人用药"替代兽药——属违法行为\n• 不得承诺某药品的"特效"或"治愈率"\n• 不得自行推荐药品\n\n✅ 正确引导：\n• 用药方案请咨询执业兽医师\n• 具体药品信息在诊疗时向兽医师了解\n• 所有用药需有正规兽药批号\n\n💰 关于医保：\n• 宠物医疗不属于医保范围\n• 宠物看病需自费或使用宠物保险\n• 建议幼年宠物投保，保费低保额高', source: '宠物医院知识库·兽药管理法规' },
      { keys: ['保证', '治愈', '100%', '包好', '无风险', '最好', '唯一', '首家', '无副作用'], text: '合规话术边界：\n\n🚫 以下表述违反《广告法》和《兽药广告审查发布规定》：\n• "手术100%成功"\n• "这个药吃了保证好"\n• "绝育绝对不会额外收费"\n• "进口药比国产好很多，副作用几乎没有"\n• "深圳最好的宠物医院"\n• "技术唯一领先"\n\n✅ 合规替代话术：\n• 手术方案根据体检结果制定，执业兽医师会评估风险并详细说明\n• 用药方案需兽医师检查后确定，效果因个体差异有所不同\n• 绝育价格区间600-2500元，具体根据体重/麻醉方式/术前检查确定\n• 药品均经过正规审批，兽医师根据情况选择最合适方案\n• 机构持有动物诊疗许可证，可到院了解设备和诊疗流程\n\n📋 法律依据：\n• 《广告法》：不得含有功效/安全性的断言或保证\n• 《兽药广告审查发布规定》：不得对未审批兽药做功效宣传\n• 不得使用"最好""唯一""首家"等绝对化用语', source: '宠物医院知识库·广告法禁忌' },
      { keys: ['保险', '理赔', '定点医院', '报销', '宠物保险'], text: '宠物保险指南：\n\n💰 常见类型：\n• 意外险：100-300元/年\n• 疾病险：500-1500元/年\n• 综合险：800-2000元/年\n\n📋 理赔流程：\n1. 就诊时告知有宠物保险\n2. 保留病历/发票/检查报告\n3. 48小时内向保险公司报案\n4. 提交理赔材料\n5. 审核7-15个工作日\n\n⚠️ 注意事项：\n• 报销比例通常60%-80%\n• 有免赔额（200-500元）\n• 既往症通常不赔\n• 定点医院可能变动，就诊前确认\n• 理赔纠纷是常见问题，保留所有凭证\n\n💡 投保建议：\n• 幼年宠物投保最划算，保费低保额高\n• 优先选择定点医院覆盖广的保险产品\n• 仔细阅读免赔条款和除外责任\n• 综合险覆盖面最广，性价比最高', source: '宠物医院知识库·保险咨询' },
      { keys: ['怎么选', '靠谱', '资质', '动物医院', '动物诊所', '许可证', '选医院'], text: '选宠物医院看什么资质：\n\n📜 资质查验：\n• 动物诊疗许可证——必须有\n• 不具备颅腔/胸腔/腹腔手术能力的机构，不得使用"动物医院"名称，只能叫"动物诊所"\n• 执业兽医资格证——可在农业农村部门查验\n• 许可证应载明：诊疗机构名称/诊疗活动范围/从业地点\n\n📋 选择标准：\n• 明码标价：价目表在醒目位置公示（法律要求）\n• 病历规范：可要求查阅病历处方笺\n• 兽药管理：药品有正规批号，处方标注完整\n• 价格透明：治疗前预估费用，不做事后报价\n• 知情同意：检查前需书面/电子知情同意\n\n⚠️ 注意：\n• 大众点评评分集中在4.5-4.9分，区分度低，不能只看评分\n• 签到后留意检查项目是否逐项说明必要性\n• 转院后注意检查结果是否互认\n• 保留缴费凭证和病历，维权需要', source: '宠物医院知识库·医院选择' },
      { keys: ['过度检查', '过度医疗', '没必要', '检查项目', '同检查不同价', '重复检查'], text: '检查项目争议处理：\n\n📋 常见争议：\n• 血常规/X光/生化多项检查同时做，是否必要？\n• 低价套餐引流后建议增加额外检查\n• 转院后被要求重新做相同检查\n\n⚖️ 您的权利：\n• 有权要求逐项说明检查必要性和费用\n• 有权在检查前获得费用预估\n• 有权要求留存知情同意记录\n• 有权要求病历处方笺（法律要求）\n\n💡 建议：\n• 就诊前询问检查项目清单和费用\n• 不确定的检查可以暂缓，先做必要的\n• 转院时带上之前的检查报告，询问是否互认\n• 保留所有缴费凭证和检查报告\n\n如已发生争议：\n• 保留证据（缴费记录/病历/检查报告）\n• 先与机构沟通\n• 未解决可向12315或农业农村局投诉\n• 可申请第三方调解', source: '宠物医院知识库·投诉框架+法规' },
      { keys: ['深圳', '宝安', '24小时', '全天', '夜间营业', '哪家好'], text: '深圳24小时宠物医院：\n\n🏥 深圳24小时急诊医院：\n• 瑞派深圳中心24小时医院（五星级动物医院）\n• 新瑞鹏集团罗湖转诊中心（2000㎡，十余个专科，2026年1月落地）\n• 祥兽宠物医院（南山区，工业七路16号）\n\n⚠️ 宝安区暂未搜索到24小时急诊医院，最近的选择在南山/罗湖。\n\n📋 夜间急诊费用参考：\n• 夜间急诊加收服务费：100-200元\n• 夜间检查费可能比白天贵\n• 到院后医生先评估症状，再决定检查项目\n\n💡 建议：\n• 如不确定是否需要急诊，先电话描述症状\n• 留意医院是否24小时有人接电话\n• 夜间就诊前确认是否有全科值班医生\n• 保留所有收费凭证', source: '宠物医院知识库·夜间急诊' }
    ],
    fallback: '您好！关于宠物健康的问题我都可以帮您解答。\n\n可以问我：\n• 疫苗接种时间和价格\n• 绝育手术费用和注意事项\n• 体检/驱虫/洗牙价格\n• 夜间急诊流程\n• 术后护理\n• 皮肤/眼睛/耳朵问题\n• 营养建议\n• 退费政策\n\n请问您想了解什么？'

  edu: {

    demoQA: [
      { keys: ['价格', '收费', '多少钱', '费用', '价目', '学费'], text: '课程收费标准（深圳参考）：\n\n📖 学科类（政府指导价）：\n• 1对1：≤77元/课时\n• 10人以下小班：≤77元/课时\n• 11-20人：≤55元/课时\n• 21-30人：≤44元/课时\n• 31人以上：≤38.5元/课时\n\n🎨 非学科类（市场调节）：\n• 编程/机器人：150-300元/课时\n• 美术/书法：100-200元/课时\n• 音乐1对1：200-500元/课时\n\n💡 暑假班套餐：\n• 20课时套餐：1200-2000元\n• 40课时套餐：2000-3800元\n• 含教材费和测评费\n\n来源：深圳发改委指导价 + 市场调研', source: '教培行业知识库' },
      { keys: ['退费', '退款', '退课', '退班'], text: '退费政策（依据法律法规）：\n\n📋 法律依据：\n• 《消费者权益保护法》第53条：预付款未按约提供应退回\n• 7天内未消费可无条件退卡\n• 《校外培训机构预收费资金监管办法》：培训费存入监管账户\n\n💰 退费计算：\n• 未消费课时：全额退款\n• 已消费课时：按原价扣除后退还余额\n• 已领教材：扣除教材费\n• 违约金：不超过未消费金额的5%\n\n⚠️ 注意事项：\n• 保留缴费凭证和合同\n• "特价课不退不换"条款无效\n• 如商家拒绝可向12315或教育局投诉\n\n退费到账时间：7-15个工作日', source: '教培行业知识库' },
      { keys: ['老师', '师资', '资格证', '教师资格'], text: '师资保障：\n\n👩‍🏫 资质要求：\n• 全部教师持教师资格证上岗\n• 学科教师需对应学科资格证\n• 教师信息公示于校区公示栏\n• 可在"校外培训家长端"APP查验\n\n📊 师资结构：\n• 学科负责人：平均教龄8年以上\n• 骨干教师：教龄5年以上\n• 青年教师：教龄2年以上\n\n🔄 不满意可换：\n• 试听不满意可无条件更换老师\n• 正式课后如不适应可申请换老师\n• 48小时内安排新老师试听', source: '教培行业知识库' },
      { keys: ['试听', '预约', '体验', '试课'], text: '预约试听：\n\n📅 预约方式：\n• 电话预约：0755-XXXX-XXXX\n• 微信预约：搜索小程序\n• 建议提前1-2天预约\n\n📋 试听须知：\n• 试听课免费，时长40分钟\n• 请携带孩子近期试卷（便于学情分析）\n• 试听后提供免费学情评估报告\n• 试听不满意可更换老师或不报名\n\n🎯 试听流程：\n1. 到店填写学生信息表\n2. 安排匹配老师试听\n3. 试听后老师出具学情分析\n4. 课程顾问推荐班型方案\n5. 自愿报名，无强制消费', source: '教培行业知识库' },
      { keys: ['暑假', '寒假', '假期', '集训'], text: '暑假班安排：\n\n📖 开课时间：\n• 第一期：7月15日-8月2日（15次课）\n• 第二期：8月5日-8月23日（15次课）\n• 每次课90分钟\n\n💰 收费：\n• 小班（10人）：1500元/期\n• 1对1：2500元/期\n• 含教材费和期末测评\n\n🎯 课程内容：\n• 小升初衔接：数学/英语重点突破\n• 初中强化：薄弱科目查漏补缺\n• 高中预备：预习新学期核心知识点\n\n📝 报名须知：\n• 需先参加学情测评（免费）\n• 根据测评结果分班\n• 7月1日前报名享早鸟价9折', source: '教培行业知识库' },
      { keys: ['一对一', '1对1', '辅导', '家教'], text: '一对一辅导：\n\n💰 收费（政府指导价上限）：\n• 小学：≤77元/课时\n• 初中：≤77元/课时\n• 高中：≤77元/课时\n• 每课时45分钟\n\n📋 服务内容：\n• 专属学情分析\n• 个性化教学方案\n• 每次课后作业反馈\n• 每月学习报告\n• 期中/期末考前冲刺\n\n🎯 适合学生：\n• 基础薄弱需要补差\n• 拔高冲刺名校\n• 学习习惯需要培养\n• 偏科严重需要突破\n\n⚠️ 正规机构一对一也受政府指导价约束，超过77元/课时属于违规。', source: '教培行业知识库' },
      { keys: ['班型', '小班', '大班', '班课'], text: '班型介绍：\n\n📖 1对1：\n• 人数：1人\n• 价格：≤77元/课时\n• 适合：个性化辅导\n\n📖 精品小班：\n• 人数：4-6人\n• 价格：≤77元/课时\n• 适合：互动学习+性价比\n\n📖 标准小班：\n• 人数：10-15人\n• 价格：≤55元/课时\n• 适合：系统学习\n\n📖 中班：\n• 人数：16-25人\n• 价格：≤44元/课时\n• 适合：基础巩固\n\n所有班型均含：教材+测评+家长反馈+课后答疑', source: '教培行业知识库' },
      { keys: ['报名', '流程', '怎么报', '注册'], text: '报名流程：\n\n1️⃣ 咨询预约\n• 电话/微信/到店咨询\n• 预约免费学情测评\n\n2️⃣ 学情测评（免费）\n• 学科测试+学习习惯评估\n• 30-45分钟\n\n3️⃣ 方案推荐\n• 根据测评结果推荐班型\n• 可试听后决定\n\n4️⃣ 签约缴费\n• 签订教育部规范合同\n• 缴费至银行监管账户\n• 获取正式发票\n\n5️⃣ 正式上课\n• 领取教材\n• 加入家长沟通群\n• 开始学习\n\n⚠️ 注意：正规机构合同需写明退费条款，缴费应进入资金监管账户。', source: '教培行业知识库' },
      { keys: ['换老师', '更换', '不满意'], text: '更换老师政策：\n\n• 试听课不满意：无条件更换\n• 正式课不适应：可申请换老师\n• 48小时内安排新老师试听\n• 换老师不影响课时数量\n• 不产生额外费用\n\n申请方式：\n• 联系课程顾问\n• 或在家长端APP操作\n\n我们承诺：每个学生都能找到适合的老师。', source: '教培行业知识库' },
      { keys: ['资质', '许可证', '办学', '合规'], text: '机构资质：\n\n📜 办学许可证：\n• 深圳市XX区教育局颁发\n• 编号可在教育局官网查验\n\n📋 合规要求：\n• 收费进入银行资金监管账户\n• 一次性收费不超过3个月或60课时\n• 教师持证上岗\n• 使用教育部规范合同文本\n• 不得布置课后作业（学科类）\n• 培训时间：工作日18:00-20:30，周末8:00-20:00\n• 寒暑假及节假日不得组织学科类培训\n\n⚠️ 非学科类培训（编程/美术/音乐）不受上述时间限制。', source: '教培行业知识库' },
      { keys: ['编程', '机器人', '科创', 'STEM'], text: '编程/科创课程：\n\n💻 课程体系：\n• Scratch启蒙（6-8岁）：动画/游戏制作\n• Python基础（9-12岁）：编程思维\n• C++算法（12岁+）：信息学奥赛\n• 机器人（8岁+）：搭建+编程\n\n💰 收费（非学科类，市场调节）：\n• 小班（6人）：150-200元/课时\n• 1对1：250-400元/课时\n• 每课时90分钟\n\n🏆 赛事通道：\n• 蓝桥杯青少年组\n• NOC全国中小学信息技术创新大赛\n• 白名单赛事辅导', source: '教培行业知识库' },
      { keys: ['美术', '书法', '画画', '绘画'], text: '美术/书法课程：\n\n🎨 美术：\n• 创意美术（4-6岁）：色彩/手工/创意\n• 少儿美术（7-12岁）：素描/水彩/动漫\n• 专业美术（12岁+）：素描/速写/色彩（艺考方向）\n\n✍️ 书法：\n• 硬笔书法（6岁+）：坐姿/笔画/结构\n• 软笔书法（8岁+）：楷书/行书\n\n💰 收费：\n• 小班：100-150元/课时\n• 1对1：200-300元/课时\n• 含画材费\n\n🎨 可参加美术考级（文化和旅游部）', source: '教培行业知识库' },
      { keys: ['英语', '语文', '数学', '物理', '化学'], text: '学科辅导说明：\n\n⚠️ 重要提示（双减政策）：\n• 学科类培训时间：工作日18:00-20:30\n• 周末/节假日/寒暑假不得组织学科类培训\n• 非学科类（编程/美术/体育）不受此限制\n\n📖 学科范围：\n• 道德与法治、语文、历史、地理、数学、外语（英语/日语/俄语）、物理、化学、生物\n\n💡 寒暑假建议：\n• 参加非学科类课程（编程/美术/体育）\n• 自主预习+阅读\n• 学习方法指导（非学科内容）\n\n如需学科辅导，请在工作日时段咨询。', source: '教培行业知识库' },
      { keys: ['课时', '消耗', '剩余', '几次'], text: '课时查询：\n\n📱 查询方式：\n• 家长端APP实时查看\n• 微信公众号→我的课时\n• 到店前台查询\n\n📋 课时说明：\n• 每次课消耗1课时\n• 请假需提前4小时通知，不扣课时\n• 未提前请假的缺席正常扣课时\n• 课时有效期：自购买起12个月\n\n如课时有疑问可随时联系课程顾问核实。', source: '教培行业知识库' },
      { keys: ['作业', '辅导', '答疑'], text: '课后辅导政策：\n\n⚠️ 双减规定：\n• 学科类培训机构不得布置课后作业\n• 课后不得有书面练习\n\n✅ 我们提供的课后服务：\n• 课堂知识点总结（发家长群）\n• 学习方法指导（非学科内容）\n• 课堂表现反馈\n• 每月学习报告\n\n📖 非学科类课程（编程/美术）：\n• 可有课后练习\n• 老师在线答疑\n• 作品点评', source: '教培行业知识库' },
      { keys: ['接送', '停车', '地址', '在哪', '校区'], text: '校区信息：\n\n📍 地址：深圳市XX区XX路XX号X楼\n🚇 地铁：X号线XX站B出口步行3分钟\n🚌 公交：XX路/XX路 XX站\n🅿️ 停车：\n• 门前有付费停车位\n• 旁边商场停车场（前2小时免费）\n• 建议绿色出行\n\n⏰ 营业时间：\n• 周一至周五：14:00-21:00\n• 周末：8:00-18:00\n• 寒暑假：8:00-18:00\n\n📞 前台电话：0755-XXXX-XXXX', source: '教培行业知识库' },
      { keys: ['竞赛', '比赛', '考级', '证书'], text: '竞赛/考级通道：\n\n🏆 白名单赛事（教育部认证）：\n• 全国中小学信息技术创新与实践大赛（NOC）\n• 蓝桥杯青少年创意编程组\n• 全国青少年人工智能创新挑战赛\n• 宋庆龄少年儿童发明奖\n\n🎨 考级：\n• 美术：文化和旅游部艺术水平考级\n• 书法：硬笔/软笔等级考试\n• 编程：电子学会青少年等级考试\n\n📌 我们提供：\n• 赛事/考级规划\n• 专项辅导班\n• 报名协助\n• 考前集训', source: '教培行业知识库' },
      { keys: ['小升初', '初升高', '升学', '中考'], text: '升学规划建议：\n\n📋 小升初：\n• 关注学习习惯培养\n• 数学思维拓展（非超前学习）\n• 英语阅读积累\n• 非学科类兴趣探索\n\n📋 初升高（中考）：\n• 关注深圳中考政策变化\n• 生地会考（初二）：重视\n• 体育中考：占60分，需长期准备\n• 指标生政策了解\n\n💡 我们提供：\n• 免费升学政策讲座（每月1次）\n• 学习规划1对1咨询\n• 心理疏导服务\n\n⚠️ 注意：正规机构不得进行与招生入学相关的培训或测试。', source: '教培行业知识库' },
      { keys: ['安全', '监控', '消防'], text: '校区安全：\n\n🛡️ 安全保障：\n• 全区域视频监控（除卫生间）\n• 每间教室配备应急照明\n• 消防设施每月检查\n• 每学期2次消防演练\n• 前台签到/签退制度\n\n👶 低龄学生：\n• 6岁以下需家长接送\n• 签到后老师对接\n• 下课通知家长接回\n\n🏥 应急处理：\n• 配备急救箱\n• 附近医院5分钟车程\n• 老师持基础急救证', source: '教培行业知识库' },
      { keys: ['合同', '签约', '协议'], text: '合同注意事项：\n\n📋 正规合同：\n• 使用教育部《中小学生校外培训服务合同》示范文本\n• 写明课程名称、课时、单价、总价\n• 写明退费规则和违约责任\n• 缴费进入银行资金监管账户\n\n⚠️ 警惕：\n• "最终解释权归机构所有"——无效条款\n• "特价课不退不换"——无效条款\n• 超过3个月或60课时的收费——违规\n• 不签合同直接上课——违规\n• 不开发票——违规\n\n✅ 签约前确认：\n1. 合同是教育部示范文本\n2. 缴费进入监管账户\n3. 退费条款清晰\n4. 索取正式发票', source: '教培行业知识库' },
      { keys: ['心理', '压力', '焦虑', '不想学'], text: '学习心理支持：\n\n🌱 我们关注：\n• 学习压力管理\n• 考试焦虑疏导\n• 学习动力激发\n• 亲子沟通指导\n\n🧑‍⚕️ 专业支持：\n• 合作心理咨询师（持证）\n• 每月免费1次心理沙龙\n• 1对1咨询可预约（另收费）\n\n💡 家长建议：\n• 关注孩子情绪而非只看成绩\n• 保证充足睡眠（9小时/晚）\n• 每天至少1小时户外活动\n• 减少课外班数量，重质量\n• 倾听孩子想法，不强迫\n\n如孩子出现严重厌学/焦虑/失眠，建议联系专业心理咨询。', source: '教培行业知识库' },
      { keys: ['寒假', '冬令营', '夏令营'], text: '寒暑假安排：\n\n⚠️ 学科类培训：\n• 寒暑假不得组织学科类培训（双减规定）\n• 可进行非学科类课程\n\n✅ 寒暑假可参加：\n• 编程/机器人营\n• 美术/书法创作营\n• 体育运动营\n• 阅读表达营\n• 科学实验营\n\n💰 收费：\n• 5天营：800-1500元\n• 10天营：1500-2800元\n• 含材料费和证书\n\n📅 寒假营：1月中下旬\n📅 暑假营：7-8月（多期可选）', source: '教培行业知识库' },
      { keys: ['折扣', '优惠', '活动', '减免'], text: '优惠政策：\n\n💰 常规优惠：\n• 早鸟价：开课前2周报名9折\n• 老带新：各减200元\n• 兄弟姐妹：第二人8折\n• 连报两期：9折\n\n🎁 公益减免：\n• 低保家庭：凭证明5折\n• 军人/教师子女：9折\n• 残障儿童：免费体验4课时\n\n⚠️ 注意：\n• 学科类折扣后不得超政府指导价\n• 优惠不叠加\n• 所有优惠需在合同中写明', source: '教培行业知识库' },
      { keys: ['投诉', '态度', '差', '不好'], text: '投诉处理：\n\n📞 投诉渠道：\n• 校区负责人：0755-XXXX-XXXX\n• 总部投诉热线：400-XXX-XXXX\n• 教育局监督电话：0755-XXXX\n• 12315消费者投诉\n\n📋 投诉流程：\n1. 记录投诉内容\n2. 24小时内回应\n3. 3个工作日内给出处理方案\n4. 跟进至满意为止\n\n我们承诺：\n• 不因投诉对孩子差别对待\n• 投诉处理过程保密\n• 合理投诉必有补偿方案', source: '教培行业知识库' },

      { keys: ['退费', '退款', '退卡', '退钱'], text: '健身卡退费处理：\n\n📋 法律依据：\n• 《消费者权益保护法》第53条：预付款未按约提供应退回\n• 第26条："一经售出概不退款"等格式条款可能无效\n\n💰 深圳健身行业自律公约：\n• 设"7天消费冷静期"，7天内未消费可全额退款\n• 退费扣除已消费部分后，按实际支付价格退费\n• 违约金一般不超过会员费的30%\n\n🔄 转卡/停卡：\n• 转卡费：≤200元（行业公约建议）\n• 停卡：每年可免费停卡1-3个月\n• 停卡需提前申请\n\n⚠️ 如商家拒绝：\n• 向12315投诉\n• 向深圳体育局投诉\n• 保留合同和付款凭证', source: '健身行业知识库' },
      { keys: ['价格', '多少钱', '办卡', '月卡', '季卡', '年卡', '收费'], text: '深圳健身卡价格参考：\n\n💳 24h智能健身房：\n• 月卡：69-239元/月\n• 季卡：299-719元/季\n• 年卡：999-2500元/年\n\n💳 中端连锁（乐刻/超级猩猩等）：\n• 月卡：200-400元/月\n• 季卡：800-1500元/季\n• 年卡：2000-4000元/年\n\n💳 高端俱乐部：\n• 年卡：5000-15000元/年\n• 含泳池/团课/私教折扣\n\n💳 次卡：\n• 单次：30-100元\n• 10次卡：200-800元\n\n建议先办月卡体验，满意再考虑长期卡。', source: '健身行业知识库' },
      { keys: ['私教', '教练', 'pt', 'PT'], text: '私教课程：\n\n💰 收费标准：\n• 普通教练：200-350元/节\n• 资深教练：350-500元/节\n• 专家级教练：500-800元/节\n• 每节60分钟\n\n📦 课包优惠：\n• 10节：约9折\n• 30节：约8折\n• 50节：约7.5折\n\n📋 教练资质：\n• 国家职业资格证书（必持）\n• NSCA-CPT/ACE/NASM等国际认证（加分）\n• 急救证书\n\n🎯 建议流程：\n1. 先买1节体验课（200-300元）\n2. 确认教练风格匹配\n3. 明确训练目标和方法\n4. 再决定是否买课包\n\n⚠️ 不要一次性买超过30节课，避免跑路风险。', source: '健身行业知识库' },
      { keys: ['合同', '须知', '注意', '签约'], text: '办卡合同注意事项：\n\n✅ 合同必须写明：\n• 会员期限和起始日期\n• 退费规则和违约金比例\n• 转卡/停卡规则\n• 场馆使用范围（单店/全城）\n• 包含服务项目\n\n⚠️ 警惕条款：\n• "最终解释权归本店所有"——无效\n• "概不退款"——无效\n• "特价卡不退不换"——无效\n• 口头承诺不写入合同——拒绝\n\n💡 办卡前确认：\n1. 先试练1-2次再决定\n2. 优先选月卡/季卡\n3. 年卡谨慎，评估跑路风险\n4. 保留合同原件和付款凭证\n5. 不刷卡套现、不私下转账\n6. 确认7天冷静期条款', source: '健身行业知识库' },
      { keys: ['游泳', '泳池'], text: '游泳服务：\n\n🏊 场馆：\n• 室内恒温泳池（25米/50米）\n• 水温26-28℃\n• 每日水质检测公示\n\n💰 收费：\n• 单次：50-100元\n• 月卡（含游泳）：300-600元\n• 游泳培训：\n  - 初级班（10节）：800-1500元\n  - 中级班（10节）：1200-2000元\n  - 1对1：300-500元/节\n\n📋 注意事项：\n• 需自备泳衣/泳帽/泳镜\n• 入池前需淋浴\n• 患有皮肤病/传染病禁止入池\n• 建议饭后1小时再游泳', source: '健身行业知识库' },
      { keys: ['瑜伽', '普拉提', '团课'], text: '瑜伽/团课服务：\n\n🧘 瑜伽课程：\n• 哈他瑜伽（入门）\n• 流瑜伽（进阶）\n• 阴瑜伽（放松）\n• 空中瑜伽（需基础）\n• 高温瑜伽（热瑜伽）\n\n💪 团课种类：\n• 动感单车\n• 莱美操课\n• 战绳训练\n• HIIT高强度间歇\n• 普拉提\n• 舞蹈\n\n💰 收费：\n• 含在月卡/年卡内（免费预约）\n• 非会员单次：50-100元\n• 瑜伽私教：300-500元/节\n\n📋 预约方式：\n• APP/小程序预约\n• 提前1-7天预约\n• 取消需提前2小时', source: '健身行业知识库' },
      { keys: ['减脂', '减肥', '瘦身', '体脂'], text: '减脂训练建议：\n\n🎯 科学减脂原则：\n• 每周减重0.5-1kg为宜\n• 热量缺口：每天300-500大卡\n• 不要节食（基础代谢下降）\n• 力量+有氧结合效果最佳\n\n📋 推荐训练计划：\n周一：力量训练（40min）+ 慢跑（20min）\n周三：HIIT间歇训练（30min）\n周五：力量训练（40min）+ 椭圆机（20min）\n周日：有氧运动（45min）\n\n🍽️ 饮食建议：\n• 蛋白质：1.5-2g/kg体重\n• 碳水：训练前后适量摄入\n• 减少精制糖和油炸\n• 每天饮水2L+\n\n⚠️ 常见误区：\n• 只做有氧不练力量→代谢降低\n• 出汗多≠减脂多\n• 局部减脂不存在\n• 体重不是唯一标准，看体脂率', source: '健身行业知识库' },
      { keys: ['增肌', '肌肉', '力量', '举铁'], text: '增肌训练建议：\n\n🎯 科学增肌原则：\n• 热量盈余：每天多摄入300-500大卡\n• 蛋白质：1.6-2.2g/kg体重\n• 渐进超负荷：逐步增加重量\n• 每个肌群每周训练2次\n\n📋 推荐训练计划（4天分化）：\n周一：胸部+三头\n周二：背部+二头\n周四：腿部+核心\n周五：肩部+手臂\n\n💪 主要动作：\n• 深蹲/硬拉/卧推/划船/推举\n• 8-12次/组，3-4组\n• 组间休息60-90秒\n\n🍽️ 营养建议：\n• 训练后30分钟内补充蛋白质+碳水\n• 每天蛋白质分4-5餐摄入\n• 可适量使用乳清蛋白粉/肌酸\n\n⚠️ 新手建议：\n• 先学动作模式，再加重量\n• 找教练指导前3个月\n• 避免盲目追求大重量', source: '健身行业知识库' },
      { keys: ['体测', '体脂', '体质', '评估'], text: '体测服务：\n\n📋 免费体测项目：\n• 体重/BMI\n• 体脂率/肌肉量\n• 基础代谢率\n• 内脏脂肪等级\n• 骨骼肌含量\n• 身体水分率\n\n📊 体测频率：\n• 建议每月1次\n• 固定时间测量（早晨空腹最佳）\n• 对比数据看趋势\n\n🎯 参考标准：\n• 男性体脂率：15-20%（正常）\n• 女性体脂率：20-25%（正常）\n• BMI：18.5-23.9（正常）\n\n体测后教练会出具训练建议报告，完全免费。', source: '健身行业知识库' },
      { keys: ['饮食', '食谱', '营养', '吃什么'], text: '健身饮食建议：\n\n🍽️ 减脂期：\n• 热量缺口300-500大卡/天\n• 蛋白质：1.5-2g/kg体重\n• 碳水：减少精制碳水，选粗粮\n• 脂肪：适量坚果/牛油果/橄榄油\n\n🍽️ 增肌期：\n• 热量盈余300-500大卡/天\n• 蛋白质：1.6-2.2g/kg体重\n• 碳水：训练日多摄入\n• 脂肪：适量\n\n📋 食物推荐：\n• 蛋白质：鸡胸肉/牛肉/鱼/蛋白/豆腐\n• 碳水：糙米/燕麦/红薯/全麦\n• 脂肪：坚果/牛油果/橄榄油/鱼油\n• 蔬菜：每餐至少一拳大小\n\n⚠️ 常见误区：\n• 不吃晚饭减脂→基础代谢下降\n• 只吃蛋白粉→营养不均衡\n• 0碳水→情绪暴躁/肌肉流失', source: '健身行业知识库' },
      { keys: ['停卡', '冻结', '暂停'], text: '停卡/冻结政策：\n\n📋 行业惯例：\n• 年卡：每年可免费停卡1-3个月\n• 季卡/月卡：通常不支持停卡\n• 停卡需提前3-7天申请\n• 停卡期间不可入馆\n\n💰 超出免费停卡时长：\n• 按月延长会员期（需补差价）\n• 或按天计算延期费用\n\n📋 申请方式：\n• 到店申请（带会员卡+身份证）\n• APP/小程序在线申请\n• 需说明原因（出差/伤病/怀孕等）\n\n⚠️ 注意：\n• 停卡后记得确认延期到新日期\n• 保留停卡确认截图', source: '健身行业知识库' },
      { keys: ['转卡', '转让', '过户'], text: '转卡/转让政策：\n\n📋 转卡规则：\n• 年卡通常可转卡1次\n• 转卡费：行业建议≤200元\n• 需双方到店办理\n• 接收方需符合会员条件\n\n💰 收费：\n• 部分健身房免费转卡\n• 部分收100-300元手续费\n• 合同中应写明\n\n📋 办理流程：\n1. 转出方和接收方同时到店\n2. 出示双方身份证+会员卡\n3. 签署转让协议\n4. 缴纳转卡费（如有）\n5. 更新系统信息\n\n⚠️ 如健身房拒绝转卡或收费过高，可参考行业自律公约协商。', source: '健身行业知识库' },
      { keys: ['器材', '设备', '器械'], text: '场馆器材：\n\n🏋️ 力量区：\n• 史密斯机/深蹲架/卧推架\n• 哑铃（2.5-50kg）\n• 杠铃片（5-25kg）\n• 龙门架/绳索\n• 各种固定器械\n\n🏃 有氧区：\n• 跑步机/椭圆机/划船机\n• 动感单车/楼梯机\n\n🧘 团课室：\n• 瑜伽垫/弹力带/泡沫轴\n• 壶铃/战绳/TRX\n\n🏊 泳池（部分门店）：\n• 25米/50米标准泳池\n• 恒温系统\n\n所有器材每月维护检修，如有损坏请及时告知前台。', source: '健身行业知识库' },
      { keys: ['时间', '营业', '几点', '24'], text: '营业时间：\n\n⏰ 24小时店：\n• 全天24小时开放\n• 22:00-6:00为无人值守时段\n• 刷卡/扫码入馆\n• 紧急呼叫按钮\n\n⏰ 常规店：\n• 周一至周日：6:00-23:00\n• 节假日：8:00-22:00\n• 团课时间：7:00-22:00\n\n⏰ 高峰时段：\n• 工作日：18:00-21:00\n• 周末：9:00-12:00 / 15:00-21:00\n• 建议错峰训练\n\n如需清晨训练，建议选择24小时店。', source: '健身行业知识库' },
      { keys: ['洗澡', '淋浴', '更衣'], text: '洗浴/更衣服务：\n\n🚿 设施：\n• 独立淋浴间（男女分开）\n• 免费洗浴用品（部分门店）\n• 吹风机/镜子\n• 储物柜（密码/手牌）\n\n📋 使用须知：\n• 训练后30分钟内不要洗热水澡\n• 洗浴时间建议≤15分钟\n• 请自备毛巾和换洗衣物\n• 储物柜当日归还，过夜需租用\n\n💰 收费：\n• 淋浴：含在会员费中\n• 储物柜租用：部分门店收费\n• 毛巾租赁：5-10元/次', source: '健身行业知识库' },
      { keys: ['停车', '地址', '在哪', '门店'], text: '门店信息：\n\n📍 地址：深圳市XX区XX路XX号X楼\n🚇 地铁：X号线XX站X出口步行X分钟\n🚌 公交：XX路/XX路 XX站\n🅿️ 停车：\n• 门前有付费停车位\n• 商场停车场（消费可减免）\n• 建议绿色出行\n\n🏪 门店分布：\n• 全城XX家门店\n• 通用卡全城可用\n• 单店卡仅限指定门店\n\n门店详情可在APP查看，选择最方便的门店。', source: '健身行业知识库' },
      { keys: ['损伤', '受伤', '疼痛', '腰疼', '膝盖'], text: '运动损伤处理：\n\n🚨 急性损伤（RICE原则）：\n• Rest 休息：立即停止训练\n• Ice 冰敷：48小时内每2-3小时冰敷15-20分钟\n• Compression 加压：弹性绷带包扎\n• Elevation 抬高：抬高受伤部位\n\n⚠️ 常见损伤：\n• 腰椎：深蹲硬拉姿势不对→减轻重量/找教练\n• 膝关节：跑步/深蹲→加强股四头肌/使用护膝\n• 肩关节：卧推/推举→加强旋转肌群\n• 网球肘：手臂训练过度→休息+冰敷\n\n💡 预防：\n• 训练前充分热身10-15分钟\n• 动态拉伸>静态拉伸（训练前）\n• 循序渐进，不要突然加量\n• 不适立刻停止，不要硬撑\n\n严重损伤请就医，不要自行处理。', source: '健身行业知识库' },
      { keys: ['新手', '小白', '第一次', '入门'], text: '新手入门指南：\n\n📋 第一次到店流程：\n1. 前台签到/刷卡\n2. 更换运动装备\n3. 体测评估（免费）\n4. 教练带做热身\n5. 基础器械体验\n6. 拉伸放松\n7. 洗浴更衣\n\n🎯 新手训练建议（前4周）：\n• 每周3次，每次45-60分钟\n• 以固定器械为主（安全）\n• 重量从轻开始，注重动作标准\n• 每次训练：热身10min + 力量30min + 有氧15min + 拉伸5min\n\n💡 新手常见错误：\n• 只跑步不练力量→身材不紧致\n• 重量太大动作变形→受伤\n• 不热身直接练→拉伤\n• 训练后不拉伸→肌肉酸痛\n• 每天练→过度训练\n\n建议前1-3个月请私教打好基础。', source: '健身行业知识库' },
      { keys: ['孕', '产后', '恢复'], text: '孕产期健身建议：\n\n🤰 孕期运动（需医生许可）：\n• 孕早期：可进行低强度有氧\n• 孕中期：瑜伽/游泳/散步\n• 孕晚期：以散步和拉伸为主\n• 禁止：仰卧位训练/腹部加压/跳跃\n\n👶 产后恢复：\n• 顺产6周/剖腹产8周后开始\n• 先恢复盆底肌和腹横肌\n• 从散步→低强度有氧→力量训练\n• 产后3个月内不做高冲击运动\n\n⚠️ 注意事项：\n• 运动前咨询医生\n• 注意核心肌群恢复\n• 哺乳期运动后1小时再哺乳\n• 运动中如有不适立即停止\n\n我们有产后恢复专项课程，可咨询前台。', source: '健身行业知识库' },
      { keys: ['老年', '老人', '中老年'], text: '中老年健身建议：\n\n🎯 训练重点：\n• 心肺功能：散步/游泳/骑车\n• 力量训练：预防肌肉流失\n• 平衡训练：预防跌倒\n• 柔韧性：关节活动度\n\n📋 推荐计划（50岁+）：\n• 有氧：每周3-5次，每次30分钟\n• 力量：每周2次，轻重多次（15-20次/组）\n• 平衡：单脚站立/太极\n• 拉伸：每天10分钟\n\n⚠️ 注意事项：\n• 运动前量血压\n• 避免憋气用力（血压升高）\n• 避免高冲击运动\n• 关节不好选游泳/椭圆机\n• 有慢性病需医生许可\n\n我们有中老年专属时段（9:00-11:00），教练免费指导。', source: '健身行业知识库' },
      { keys: ['青少年', '孩子', '未成年'], text: '青少年健身政策：\n\n📋 年龄要求：\n• 12岁以下：需家长陪同\n• 12-16岁：需家长签署同意书\n• 16-18岁：可独立入馆（部分门店）\n• 18岁以上：无限制\n\n🎯 青少年训练建议：\n• 以自重训练为主\n• 避免大重量力量训练（骨骼发育期）\n• 注重运动习惯培养\n• 每天至少60分钟中高强度运动\n\n💰 收费：\n• 部分门店有青少年优惠卡\n• 学生卡：需提供学生证\n• 暑假学生卡：特价\n\n⚠️ 青少年禁止使用：\n• 大重量自由力量\n• 极端减重/增肌\n• 任何补剂（除医生建议）', source: '健身行业知识库' },
      { keys: ['补剂', '蛋白粉', '肌酸', '氮泵'], text: '运动补剂说明：\n\n🥛 乳清蛋白粉：\n• 作用：补充蛋白质，方便快捷\n• 用量：每次20-30g，训练后摄入\n• 适合：蛋白质摄入不足人群\n\n💪 肌酸：\n• 作用：提升力量输出\n• 用量：每天3-5g\n• 适合：力量训练人群\n• 需长期服用才有效\n\n⚡ 氮泵（pre-workout）：\n• 作用：提升训练状态\n• 含咖啡因/β-丙氨酸\n• 不建议新手使用\n• 避免晚上使用影响睡眠\n\n⚠️ 注意：\n• 补剂不能代替正餐\n• 优先从食物获取营养\n• 购买认准品牌和认证\n• 有肝肾疾病慎用\n\n我们前台有补剂零售，也可自行购买。', source: '健身行业知识库' },
      { keys: ['团操', '课程表', '排课'], text: '团课课程表：\n\n📅 每日课程：\n• 7:00 晨间瑜伽\n• 12:00 午间HIIT\n• 18:30 动感单车\n• 19:30 莱美bodypump\n• 20:30 瑜伽拉伸\n\n📅 周末特色课：\n• 9:00 户外跑团\n• 10:00 普拉提\n• 15:00 舞蹈\n• 16:00 功能训练\n\n📋 预约规则：\n• APP/小程序预约\n• 提前1-7天\n• 取消需提前2小时\n• 连续3次预约不到将限制预约1周\n\n💰 收费：\n• 含在月卡/年卡内\n• 非会员单次：50-100元', source: '健身行业知识库' },
      { keys: ['跑路', '倒闭', '关门', '诈骗'], text: '健身房跑路防范：\n\n🚨 预警信号：\n• 突然大规模促销/超低价年卡\n• 欠租/欠薪/设备维护停滞\n• 频繁更换法人/股东\n• 要求私下转账不开发票\n• 合同主体跟宣传品牌不一致\n\n🛡️ 防范措施：\n• 优先选月卡/季卡，少买年卡\n• 不一次性购买超过30节私教课\n• 确认合同主体公司名称\n• 保留合同/发票/付款记录\n• 缴费进入公司账户，不转个人\n\n⚖️ 如果跑路：\n1. 联合其他会员统计损失\n2. 向12315投诉\n3. 向公安局经侦报案\n4. 向法院起诉\n5. 关注预收费资金监管政策\n\n深圳已推行健身行业预收费资金监管，缴费进入监管账户更有保障。', source: '健身行业知识库' },
      { keys: ['wifi', 'WiFi', '网络', '充电'], text: '场馆设施：\n\n📶 WiFi：\n• 免费WiFi覆盖全场\n• 密码在前台/更衣室公示\n\n🔌 充电：\n• 更衣室有插座\n• 部分跑步机有USB口\n• 建议自带充电宝\n\n🧴 其他服务：\n• 直饮水机\n• 自动售货机（饮料/补剂）\n• 体重秤/体测仪\n• 毛巾租赁（5-10元）\n• 储物柜（免费/付费）\n\n如有设施问题请告知前台，我们会及时维修。', source: '健身行业知识库' },
      { keys: ['疾病', '高血压', '心脏病', '糖尿病'], text: '特殊人群健身建议：\n\n🫀 心血管疾病：\n• 需医生许可后运动\n• 以中低强度有氧为主\n• 避免憋气和力量爆发\n• 随身携带急救药物\n• 运动时心率不超过最大心率的70%\n\n🩸 高血压：\n• 血压稳定后运动\n• 避免头低于心脏的动作\n• 避免憋气\n• 有氧运动为主\n\n🩺 糖尿病：\n• 运动前测血糖\n• 随身携带糖果防低血糖\n• 避免空腹运动\n• 运动后注意足部检查\n\n🦴 关节炎/腰椎间盘突出：\n• 避免冲击性运动\n• 游泳/椭圆机更友好\n• 加强周围肌肉力量\n• 疼痛时停止\n\n所有特殊人群运动前必须咨询医生。', source: '健身行业知识库' },
      { keys: ['locker', '储物', '柜子'], text: '储物柜使用：\n\n📋 使用规则：\n• 会员免费使用（当日归还）\n• 密码柜：自设密码\n• 手牌柜：前台领取手牌\n\n💰 收费（部分门店）：\n• 日租：免费-10元\n• 月租：50-100元/月\n• 过夜存放需租月柜\n\n⚠️ 注意：\n• 贵重物品请随身携带\n• 不要存放超过24小时\n• 丢失物品场馆不赔偿\n• 离馆前清空储物柜\n\n如有物品遗忘，请联系前台，我们保留7天。', source: '健身行业知识库' }

      { keys: ['价格', '多少钱', '价目', '收费', '价目表'], text: '深圳美发价格参考：\n\n✂️ 洗剪吹：\n• 快剪/团购：9.9-29.9元\n• 社区店常规：45-68元\n• 中端连锁：78-160元\n• 高端salon：200-500元\n\n🎨 染发：\n• 普通店：60-100元\n• 中端专业店：200-300元\n• 高端salon：494-800+元\n• 挑染/渐变：+50-200元\n\n〰️ 烫发：\n• 普通店：80-150元\n• 中端专业店：200-400元\n• 高端salon：500-1500元\n\n🧴 护理/焗油：\n• 基础护理：50-100元\n• 深层修复：100-300元\n\n具体以门店价目表为准，首次到店可享体验价。', source: '美发行业知识库' },
      { keys: ['退卡', '退费', '退款', '预付卡', '退钱'], text: '美发预付卡退卡：\n\n📋 法律依据：\n• 《消费者权益保护法》第26条：不得以"卡面标注不可退"拒绝\n• 第53条：预付款未按约提供应退回\n• 7天未消费可无条件退卡\n\n💰 退费计算：\n• 已消费部分按原价（非折扣价）扣除\n• 剩余金额退还\n• 不得收取超过未消费金额30%的违约金\n\n🏪 门店关闭/转让：\n• 消费者可向总店/品牌方主张退款\n• 向12315投诉\n• 向市场监督管理局举报\n• 保留充值凭证和消费记录\n\n⚠️ 注意：\n• "特价卡不退不换"条款无效\n• "最终解释权归本店所有"无效\n• 不开发票可向税务局举报', source: '美发行业知识库' },
      { keys: ['发型', '脸型', '圆脸', '方脸', '长脸', '菱形脸'], text: '发型建议（按脸型）：\n\n🟠 圆脸：\n• 推荐：侧分长发、高层次锁骨发、八字刘海\n• 避免：齐刘海、贴头皮直发、下巴长度的内扣\n\n🟫 方脸：\n• 推荐：大波浪、空气刘海、层次感长发\n• 避免：一刀切短发、贴头皮发型\n\n🟡 长脸：\n• 推荐：齐刘海、蓬松短发、中长卷发\n• 避免：贴头皮长发、中分无刘海\n\n🔺 菱形脸：\n• 推荐：斜刘海、下巴层次、蓬松中长发\n• 避免：头顶太蓬（显颧骨更宽）\n\n建议到店让发型师根据发质、头型、肤色做免费设计咨询，满意再决定。', source: '美发行业知识库' },
      { keys: ['预约', '发型师', '预约时间', '排队'], text: '预约方式：\n\n📅 预约渠道：\n• 电话预约：0755-XXXX-XXXX\n• 微信小程序预约\n• 到店预约\n\n⏰ 预约建议：\n• 可指定发型师\n• 建议提前1-2天预约\n• 周末高峰建议提前3天\n• 节假日提前5-7天\n\n📋 预约须知：\n• 预约后如需改期，提前4小时通知\n• 迟到15分钟以上可能需要重新排队\n• 首次到店可享免费发型设计咨询\n\n如需指定某位发型师，请在预约时说明。', source: '美发行业知识库' },
      { keys: ['染发', '染', '颜色', '褪色', '掉色'], text: '染发须知：\n\n🎨 染发类型：\n• 单色染：全头一个颜色\n• 挑染/片染：局部染色\n• 渐变染：颜色过渡\n• 漂发：需先褪色再染色\n\n💰 价格因素：\n• 头发长度（短/中/长/超长）\n• 染发类型（单色/挑染/渐变）\n• 是否需要漂发\n• 使用的染膏品牌\n\n📋 注意事项：\n• 染发前48小时做过敏测试\n• 染发前1-2天不要洗头（天然油脂保护头皮）\n• 染发后48小时不要洗头（固色）\n• 使用护色洗发水延长褪色\n• 染发间隔建议≥1个月\n\n⚠️ 染发后褪色是正常现象，一般可维持4-8周。深色比浅色持久。', source: '美发行业知识库' },
      { keys: ['烫发', '烫', '卷发', '卷'], text: '烫发须知：\n\n〰️ 烫发类型：\n• 冷烫：适合中短发，卷度自然\n• 热烫/数码烫：适合长发，卷度持久\n• 离子烫：直发烫\n• 摩根烫：发根蓬松\n• 纹理烫：自然微卷\n\n💰 价格因素：\n• 头发长度\n• 烫发类型\n• 药水品牌\n\n📋 注意事项：\n• 烫发前1周不要染发\n• 烫发后48-72小时不要洗头\n• 烫发后1周内不要扎头发\n• 使用弹力素/卷发护理产品\n• 定期做发膜护理\n\n⚠️ 烫发损伤发质，建议烫染不同时进行，间隔至少2周。', source: '美发行业知识库' },
      { keys: ['护理', '焗油', '发膜', '修复', '损伤'], text: '头发护理服务：\n\n🧴 护理类型：\n• 基础焗油：50-100元\n• 深层修复发膜：100-300元\n• 角蛋白护理：200-500元\n• 头皮护理：150-400元\n• 去屑/防脱疗程：200-600元\n\n📋 建议频率：\n• 健康发质：每月1次\n• 受损发质：每2周1次\n• 烫染后：每周1次（连续4周）\n\n🏠 居家护理建议：\n• 使用温水洗头（不要太热）\n• 洗发水先在手心搓出泡沫再上头\n• 护发素只涂发中到发尾，不涂头皮\n• 吹风机用中低温，先吹发根\n• 定期使用发膜（每周1-2次）\n• 减少使用夹板/卷发棒\n\n严重脱发/头皮问题建议就医皮肤科。', source: '美发行业知识库' },
      { keys: ['男发', '男生', '男士', '男'], text: '男士发型服务：\n\n✂️ 男士剪发：\n• 快剪：15-30元（10分钟）\n• 精剪：50-150元\n• 总监剪：150-300元\n\n🎨 男士造型：\n• 烫发（纹理/摩根）：200-500元\n• 染发：100-300元\n• 刮脸/修面：30-80元\n\n💈 热门男士发型：\n• 碎盖头/锅盖头\n• 中分/三七分\n• 背头/油头\n• 寸头/圆寸\n• 纹理烫/钢夹烫\n\n📋 建议：\n• 男士发型建议3-4周修剪一次\n• 油头需每天用发蜡/发油造型\n• 烫发可减少日常造型时间\n\n首次到店可免费设计咨询。', source: '美发行业知识库' },
      { keys: ['儿童', '小孩', '宝宝', '儿童剪'], text: '儿童剪发服务：\n\n👶 儿童剪发：\n• 价格：25-60元\n• 年龄：1-12岁\n• 提供儿童座椅和玩具\n• 经验丰富的发型师操作\n\n📋 注意事项：\n• 建议选孩子精神状态好的时段\n• 首次剪发可先让孩子熟悉环境\n• 如孩子哭闹不要强迫\n• 剪完后给小奖励（部分门店）\n\n💇 儿童发型推荐：\n• 男孩：碎盖头/寸头/西瓜头\n• 女孩：齐刘海/蘑菇头/双马尾\n\n💰 儿童套餐：\n• 剪发+造型：50-80元\n• 剪发+洗护：60-100元', source: '美发行业知识库' },
      { keys: ['接发', '长发', '接长'], text: '接发服务：\n\n💇 接发类型：\n• 贴片接发：最常见，1-2小时\n• 水晶线接发：无痕自然\n• 微环接发：可重复使用\n• 编接：适合发量少的\n\n💰 价格（深圳参考）：\n• 贴片接发：800-2000元\n• 水晶线接发：1500-3000元\n• 微环接发：2000-4000元\n• 接发长度：40-80cm可选\n\n📋 维护须知：\n• 接发可维持2-3个月\n• 每4-6周需到店维护一次\n• 洗头时不要用力搓接发处\n• 不要使用含酒精的造型产品\n• 睡觉时建议扎松散马尾\n\n⚠️ 接发会增加头发负担，发质很细软的需评估。', source: '美发行业知识库' },
      { keys: ['头皮', '脱发', '掉发', '头屑', '头痒'], text: '头皮问题处理：\n\n🧴 头皮护理：\n• 深度清洁：去除多余油脂和残留\n• 头皮按摩：促进血液循环\n• 精油护理：舒缓头皮\n• 去屑疗程：专业去屑产品\n\n📋 常见问题：\n• 头屑多：换用去屑洗发水，如酮康唑/二硫化硒\n• 头皮油：选无硅油洗发水，隔天洗\n• 脱发多：每天掉50-100根正常，超量需就医\n• 头皮痒：排查过敏/真菌感染\n\n⚠️ 严重脱发/斑秃/脂溢性皮炎：\n• 建议就医皮肤科\n• 可能需要药物治疗\n• 植发咨询专业机构\n\n我们提供头皮检测（免费），可到店咨询。', source: '美发行业知识库' },
      { keys: ['白发', '白头发', '染白发'], text: '白发/遮白发服务：\n\n🎨 遮白发染发：\n• 单次染发：80-200元\n• 只染发根（补染）：50-100元\n• 建议每3-4周补染一次发根\n\n📋 白发护理建议：\n• 选择温和的染发产品\n• 染发间隔≥3周\n• 染发后使用护色洗发水\n• 可考虑植物染发（更温和但持久度低）\n\n⚠️ 注意：\n• 频繁染发损伤头皮和发质\n• 过敏体质需做过敏测试\n• 孕妇不建议染发\n• 头皮有伤口时不染发\n\n如有大量白发，建议接受自然老化的过程，或选择局部挑染遮盖。', source: '美发行业知识库' },
      { keys: ['洗发', '洗头', '洗护'], text: '洗护服务：\n\n🧴 洗护类型：\n• 基础洗吹：20-50元\n• 洗剪吹：45-160元\n• 洗护+造型：80-200元\n• 头皮深层清洁：80-150元\n\n📋 洗护流程：\n1. 梳通头发\n2. 温水润湿（38-40℃）\n3. 洗发水清洁2遍\n4. 护发素/发膜\n5. 按摩头皮3-5分钟\n6. 温水冲净\n7. 毛巾吸干（不搓）\n8. 吹干+造型\n\n💡 选洗发水建议：\n• 油性头皮：无硅油/控油型\n• 干性发质：滋润型/含角蛋白\n• 受损发质：修复型/含氨基酸\n• 染后发质：护色型\n• 敏感头皮：无香精/无色素', source: '美发行业知识库' },
      { keys: ['造型', '吹风', '做造型', '盘发'], text: '造型服务：\n💆 日常造型：\n• 吹风造型：30-80元\n• 卷发造型：50-120元\n• 编发：50-150元\n\n💒 婚礼/活动造型：\n• 新娘造型（含试妆）：500-2000元\n• 伴娘造型：100-300元/人\n• 晚宴造型：100-300元\n• 舞台造型：200-500元\n\n📋 造型须知：\n• 造型前头发需干净无油\n• 短发造型约20分钟\n• 长发造型约40-60分钟\n• 婚礼造型建议提前1-2周试妆\n\n提供上门服务（另收费），需提前预约。', source: '美发行业知识库' },
      { keys: ['会员', '充值', '预付', '办卡'], text: '会员卡/充值政策：\n\n💰 充值套餐（参考）：\n• 充500送50\n• 充1000送150\n• 充2000送400\n• 充3000送800\n\n📋 注意事项：\n• 充值后每次消费从余额扣除\n• 余额可查（小程序/前台）\n• 充值金额1年内有效\n• 7天内未消费可全额退款\n\n⚠️ 办卡前确认：\n• 合同写明退费规则\n• 充值金额不要超过3个月预计消费\n• 保留充值凭证\n• 确认门店是否连锁通用\n• 警惕"不退不换"条款（无效）\n\n建议先体验1-2次再决定是否充值。', source: '美发行业知识库' },
      { keys: ['过敏', '红肿', '痒', '刺激'], text: '染发/烫发过敏处理：\n\n🚨 过敏症状：\n• 头皮红肿/瘙痒\n• 接触性皮炎\n• 面部/颈部红疹\n• 严重者呼吸困难\n\n📋 预防措施：\n• 染发前48小时做过敏测试（耳后/手腕内侧）\n• 告知发型师过敏史\n• 选择低敏/植物染发剂\n• 避免染发剂接触头皮\n\n🏠 轻微过敏处理：\n• 立即用大量温水冲洗\n• 停止使用相关产品\n• 涂抹炉甘石洗剂止痒\n• 口服抗组胺药（如氯雷他定）\n\n⚠️ 严重过敏（红肿扩散/呼吸困难）：\n• 立即就医\n• 携带染发剂包装供医生参考\n\n如有过敏史，每次染发前必须做过敏测试。', source: '美发行业知识库' },
      { keys: ['怀孕', '孕妇', '哺乳'], text: '孕期美发建议：\n\n🤰 孕期美发安全：\n• 染发：建议孕早期（前3月）避免\n• 烫发：建议整个孕期避免\n• 剪发：安全，无影响\n• 护理：使用孕妇安全产品\n\n📋 如需染发：\n• 选择孕中后期（4-9月）\n• 使用植物/无氨染发剂\n• 在通风良好的环境\n• 染发剂不接触头皮\n• 做过敏测试\n\n👶 哺乳期：\n• 染发/烫发后48小时内不要哺乳\n• 确保染发剂完全冲洗干净\n• 使用温和的洗护产品\n\n建议孕期以剪发和基础护理为主，烫染等化学处理尽量推迟。', source: '美发行业知识库' },
      { keys: ['时间', '营业', '几点', '关门'], text: '营业时间：\n\n⏰ 常规营业：\n• 周一至周日：10:00-22:00\n• 节假日：10:00-21:00\n• 部分门店24小时营业\n\n⏰ 高峰时段：\n• 工作日：18:00-21:00\n• 周末：13:00-20:00\n• 节假日前一天：全天高峰\n• 建议错峰或预约\n\n📍 门店地址：\n• 深圳市XX区XX路XX号\n• 地铁X号线XX站X出口\n• 门前有付费停车位', source: '美发行业知识库' },
      { keys: ['团购', '优惠券', '活动', '特价'], text: '优惠活动：\n\n💰 常规优惠：\n• 新客首次到店：洗剪吹体验价29.9元\n• 团购平台（美团/大众点评）：9.9-68元\n• 工作日上午：部分项目8折\n• 老带新：各减20元\n\n🎁 会员优惠：\n• 充值送金额\n• 生日月：免费护理1次\n• 节假日：赠送造型\n\n⚠️ 注意：\n• 团购价可能有使用限制（指定发型师/时段）\n• 确认团购包含的项目内容\n• 团购不与店内其他优惠叠加\n• 团购也享受退费保障\n\n建议比较团购价和门店价，选择合适的。', source: '美发行业知识库' },
      { keys: ['投诉', '态度', '差', '不好', '不满'], text: '投诉处理：\n\n📞 投诉渠道：\n• 门店店长：0755-XXXX-XXXX\n• 品牌客服热线：400-XXX-XXXX\n• 12315消费者投诉\n• 大众点评/美团差评\n\n📋 投诉流程：\n1. 记录投诉内容和服务人员\n2. 24小时内回应\n3. 3个工作日内给出处理方案\n4. 可选方案：重做/退款/补偿\n\n我们承诺：\n• 不满意可免费重做（当天）\n• 7天内对发型不满意可免费调整\n• 合理投诉必有补偿\n• 不因投诉对客人差别对待', source: '美发行业知识库' },
      { keys: ['发质', '粗', '细', '软', '硬', '干枯'], text: '不同发质护理建议：\n\n🧴 细软发质：\n• 选择丰盈型洗发水\n• 吹风时低头倒吹增加蓬松感\n• 避免使用厚重护发素\n• 可烫发根增加蓬松\n\n🧴 粗硬发质：\n• 选择滋润型洗发水\n• 定期做软化/离子烫\n• 使用发膜深层护理\n• 吹干时使用梳子辅助\n\n🧴 干枯/受损发质：\n• 减少洗头频率（隔天即可）\n• 使用修复型洗护产品\n• 每周1-2次发膜\n• 减少热 styling（夹板/卷发棒）\n• 定期修剪分叉发尾\n\n�tel 油性发质：\n• 每天或隔天洗头\n• 选择无硅油控油型\n• 护发素只涂发尾\n• 避免频繁用手摸头发', source: '美发行业知识库' },
      { keys: ['工具', '消毒', '卫生', '干净'], text: '卫生消毒标准：\n\n🧼 工具消毒：\n• 剪刀/梳子：每客使用后紫外线消毒\n• 毛巾：一客一换，高温清洗消毒\n• 围布：每日清洗\n• 染碗/刷：每客更换\n\n📋 环境卫生：\n• 地面每日清洁3次\n• 洗头区每日消毒\n• 镜面/台面每客擦拭\n• 通风系统每月维护\n\n⚠️ 消毒标准：\n• 使用专业消毒剂（75%酒精/紫外线）\n• 工具消毒柜温度≥180℃\n• 毛巾清洗温度≥90℃\n\n如对卫生有疑虑，可要求发型师当面消毒工具。', source: '美发行业知识库' },
      { keys: ['停车', '地址', '在哪'], text: '门店信息：\n\n📍 地址：深圳市XX区XX路XX号\n🚇 地铁：X号线XX站X出口步行X分钟\n🚌 公交：XX路/XX路 XX站\n🅿️ 停车：\n• 门前有付费停车位\n• 商场停车场（消费减免）\n• 建议绿色出行\n\n🏪 连锁门店：\n• 全城XX家门店\n• 会员卡通用（部分门店）\n• 可在不同门店使用\n\n门店详情可在小程序查看。', source: '美发行业知识库' },

const DEPLOY_KEYWORDS = ['部署', '接入', '能定制', '定制一套', '定制吗', '我的行业', '怎么合作', '买一套', '怎么卖'];
const DEPLOY_REPLY = {
  text: '这套AI客服可以这样落地到您的门店：\n\n1️⃣ 提供您的价目表、常见问题、门店信息\n2️⃣ 我们整理成专属知识库（1天）\n3️⃣ 部署上线，生成您门店专属的聊天链接/二维码（2天）\n\n✅ 全程不需要您懂技术\n✅ 界面会换成您门店的名字和主题色\n✅ 支持微信扫码直接对话\n\n留下您的联系方式，我们1对1演示给您看。',
  source: null,
  cta: true
};

let currentIndustry = 'pet';
let messages = [];
let isTyping = false;
let aiReplyCount = 0;
let ctaShown = false;

// === ?brand= 参数：演示时替换为客户店名 ===
(function applyBrandParam() {
  const params = new URLSearchParams(location.search);
  const brand = params.get('brand');
  const industry = params.get('industry');
  if (brand) {
    Object.values(industries).forEach(ind => {
      const suffix = ind.brand.split('·')[1];
      ind.brand = brand + (suffix ? ' · ' + suffix.trim() : '');
      ind.welcomeTitle = '您好，欢迎来到' + brand + ' 🐾';
    });
  }
  // ?industry= 参数自动切换行业
  if (industry && industries[industry]) {
    setTimeout(() => switchIndustry(industry), 100);
  }
})();

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function nowTime() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function switchIndustry(key) {
  currentIndustry = key;
  const ind = industries[key];
  document.body.dataset.industry = key;
  document.getElementById('avatar').textContent = ind.icon;

  const nameEl = document.getElementById('brandName');
  nameEl.childNodes[0].nodeValue = ind.brand + ' ';

  document.querySelectorAll('.industry-option').forEach(opt => {
    opt.classList.toggle('active', opt.dataset.key === key);
  });

  document.getElementById('drawer').classList.remove('open');
  messages = [];
  isTyping = false;
  aiReplyCount = 0;
  ctaShown = false;
  renderWelcome();
  renderQuickReplies();
  document.getElementById('quickReplies').classList.remove('hidden');
}

function toggleDrawer() {
  document.getElementById('drawer').classList.toggle('open');
}

function askOtherIndustry() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('input').value = '我的行业不在列表里，能定制吗';
  send();
}

function renderWelcome() {
  const ind = industries[currentIndustry];
  const el = document.getElementById('messages');
  el.innerHTML = `
    <div class="welcome">
      <div class="welcome-icon">${ind.icon}</div>
      <div class="welcome-title">${escapeHtml(ind.welcomeTitle)}</div>
      <div class="welcome-desc">${escapeHtml(ind.welcomeDesc)}</div>
      <div class="welcome-suggestions">
        ${ind.suggestions.map((s, idx) => `
          <div class="suggestion-card" onclick="askSuggestion(${idx})">

            <div class="suggestion-text">
              <div class="suggestion-title">${escapeHtml(s.title)}</div>
              <div class="suggestion-desc">${escapeHtml(s.desc)}</div>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="welcome-footer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L3 7v6c0 5 3.5 9 9 11 5.5-2 9-6 9-11V7l-9-5z"/></svg>
        演示数据 · 上线时可替换为您门店的真实价目表和问答
      </div>
    </div>
  `;
}

function askSuggestion(idx) {
  const s = industries[currentIndustry].suggestions[idx];
  document.getElementById('input').value = s.ask || s.title;
  send();
}

function renderQuickReplies() {
  const ind = industries[currentIndustry];
  const el = document.getElementById('quickReplies');
  el.innerHTML = ind.quickReplies.map((q, idx) =>
    `<div class="quick-reply" onclick="askQuickReply(${idx})">${q}</div>`
  ).join('');
}

function askQuickReply(idx) {
  const raw = industries[currentIndustry].quickReplies[idx];
  // 去掉前缀 emoji，只留文字部分用于匹配
  const text = raw.replace(/^[\p{Emoji}\u200d\ufe0f\s]+/u, '');
  document.getElementById('input').value = raw;
  send();
}

function matchQA(text) {
  // 部署意向优先
  if (DEPLOY_KEYWORDS.some(k => text.includes(k))) return DEPLOY_REPLY;
  const qa = industries[currentIndustry].demoQA;
  for (const item of qa) {
    if (item.keys.some(k => text.includes(k))) return item;
  }
  return { text: industries[currentIndustry].fallback, source: null };
}

function send() {
  if (isTyping) return;

  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';

  messages.push({ role: 'user', content: text, time: nowTime() });
  renderMessages();

  document.getElementById('quickReplies').classList.add('hidden');

  isTyping = true;
  renderMessages();

  setTimeout(() => {
    const resp = matchQA(text);
    isTyping = false;

    // 打字机效果：先推入空内容消息，逐字填充
    const msg = { role: 'ai', content: '', source: resp.source, cta: resp.cta, fullText: resp.text, time: nowTime() };
    messages.push(msg);
    renderMessages();
    typewriteLast(msg, () => {
      msg.content = msg.fullText;
      delete msg.fullText;
      aiReplyCount++;
      renderMessages();
      // 部署话术 → 紧跟留资表单
      if (resp.cta) {
        messages.push({ role: 'ai', content: '太好了！留个联系方式，马上为您安排 👇', form: true, submitted: false, time: nowTime() });
        renderMessages();
        return;
      }
      // 第二轮 AI 回复后插入转化卡片
      if (aiReplyCount === 2 && !ctaShown) {
        ctaShown = true;
        messages.push({
          role: 'ai',
          content: '顺便说一句：您现在看到的问答，全部可以换成【您门店自己的】价目表和知识。',
          cta: true,
          time: nowTime()
        });
        renderMessages();
      }
    });
  }, 600 + Math.random() * 500);
}

function typewriteLast(msg, done) {
  const el = document.getElementById('messages');
  const bubbles = el.querySelectorAll('.msg.ai .msg-bubble');
  const bubble = bubbles[bubbles.length - 1];
  if (!bubble) { done && done(); return; }

  const full = msg.fullText;
  let i = 0;
  const timer = setInterval(() => {
    i += 2;
    bubble.innerHTML = escapeHtml(full.slice(0, i)).replace(/\n/g, '<br>') +
      (i < full.length ? '<span class="typing-cursor"></span>' : '');
    // 打字中只在接近底部时跟随滚动
    const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 120;
    if (nearBottom) el.scrollTop = el.scrollHeight;
    if (i >= full.length) {
      clearInterval(timer);
      done && done();
    }
  }, 18);
}

function renderMessages() {
  const el = document.getElementById('messages');
  const nearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 120;

  document.getElementById('sendBtn').disabled = isTyping;

  if (messages.length === 0) {
    renderWelcome();
    return;
  }

  el.innerHTML = messages.map((m, i) => {
    const isLast = i === messages.length - 1;
    const avatar = m.role === 'user' ? '我' : industries[currentIndustry].icon;
    const displayText = m.fullText !== undefined ? m.content : m.content;
    return `
      <div class="msg ${m.role}">
        <div class="msg-avatar">${avatar}</div>
        <div class="msg-content">
          <div class="msg-bubble">${escapeHtml(displayText).replace(/\n/g, '<br>')}</div>
          ${m.source ? `
            <div class="msg-source">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z"/></svg>
              参考来源：${escapeHtml(m.source)}
            </div>
          ` : ''}
          ${m.form ? `
            <div class="cta-card">
              ${m.submitted ? `
                <div class="lead-success">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z"/></svg>
                  已收到！我们会尽快联系您安排1对1演示
                </div>
              ` : `
                <div class="cta-card-title">📞 留下联系方式，免费1对1演示</div>
                <div class="cta-card-desc">微信号或手机号均可，仅用于本次演示预约</div>
                <input class="lead-input" id="leadInput" type="text" placeholder="您的微信或手机号" maxlength="30">
                <button class="cta-card-btn" onclick="submitLead()">预约演示 →</button>
              `}
            </div>
          ` : ''}
          ${m.cta && m.fullText === undefined ? `
            <div class="cta-card">
              <div class="cta-card-title">🏪 给你的店也做一个AI客服</div>
              <div class="cta-card-desc">输入店名，3秒生成你的专属体验链接</div>
              <input class="lead-input" id="brandInput" type="text" placeholder="输入你的店名" maxlength="30">
              <button class="cta-card-btn" onclick="generateDemoLink()">生成我的AI客服 →</button>
            </div>
          ` : ''}
          ${m.demoLink ? `
            <div class="cta-card">
              <div class="cta-card-title">✅ 你的专属AI客服已生成！</div>
              <div class="cta-card-desc">点击下方链接体验你店专属的AI客服：</div>
              <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:12px;margin:8px 0;word-break:break-all;font-size:13px;color:#15803d;">
                ${m.demoLink}
              </div>
              <button class="cta-card-btn" onclick="copyLink('${m.demoLink}')" style="margin-bottom:8px;">📋 复制链接</button>
              <button class="cta-card-btn" onclick="shareLink('${m.demoLink}', '${m.brandName || '我的店'}')" style="margin-bottom:8px;background:#fff;color:var(--primary);border:1px solid var(--primary);">📤 分享给朋友</button>
              <button class="cta-card-btn" onclick="askDeploy()" style="background:#fff;color:var(--primary);border:1px solid var(--primary);">了解怎么部署到微信 →</button>
            </div>
          ` : ''}
          ${m.role === 'ai' && isLast && !isTyping && m.fullText === undefined ? `
            <div class="msg-feedback" data-msg="${i}">
              <button class="fb-btn" onclick="feedback(this)">👍 有帮助</button>
              <button class="fb-btn" onclick="feedback(this)">👎 没帮助</button>
            </div>
          ` : ''}
          <div class="msg-time">${m.time || ''}</div>
        </div>
      </div>
    `;
  }).join('');

  if (isTyping) {
    el.innerHTML += `
      <div class="msg ai">
        <div class="msg-avatar">${industries[currentIndustry].icon}</div>
        <div class="msg-content">
          <div class="msg-bubble">
            <div class="typing"><span></span><span></span><span></span></div>
          </div>
        </div>
      </div>
    `;
    el.scrollTop = el.scrollHeight;
    return;
  }

  if (nearBottom) el.scrollTop = el.scrollHeight;
}

function askDeploy() {
  document.getElementById('input').value = '我想部署一套到我的门店';
  send();
}

function generateDemoLink() {
  const input = document.getElementById('brandInput');
  const value = (input.value || '').trim();
  if (value.length < 2) {
    input.style.borderColor = '#E53935';
    input.placeholder = '请输入店名（至少2个字）';
    input.focus();
    return;
  }
  const link = location.origin + location.pathname + '?brand=' + encodeURIComponent(value) + '&industry=' + currentIndustry;
  // 存到 leads
  const leads = JSON.parse(localStorage.getItem('demo_leads') || '[]');
  leads.push({
    brand: value,
    industry: currentIndustry,
    link: link,
    time: new Date().toISOString()
  });
  localStorage.setItem('demo_leads', JSON.stringify(leads));
  // 显示生成的链接
  messages.push({ role: 'ai', content: '', demoLink: link, time: nowTime() });
  renderMessages();
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
}

function copyLink(link) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(link).then(() => {
      alert('链接已复制！粘贴到浏览器即可体验');
    });
  } else {
    // 降级方案
    const ta = document.createElement('textarea');
    ta.value = link;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('链接已复制！粘贴到浏览器即可体验');
  }
}

function shareLink(link, brand) {
  const text = '我做了个AI客服demo，输入店名就能生成专属体验链接，你也试试：\n' + link;
  if (navigator.share) {
    navigator.share({ title: brand + ' 专属AI客服', text: text, url: link });

      });

      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      alert('分享文案已复制！粘贴到微信/朋友圈即可');
    }
  }
}

function submitLead() {
  const input = document.getElementById('leadInput');
  const value = (input.value || '').trim();
  if (value.length < 5) {
    input.style.borderColor = '#E53935';
    input.placeholder = '请填写正确的微信或手机号';
    input.focus();
    return;
  }
  // demo 阶段存 localStorage；正式部署改为 POST 到后端
  const leads = JSON.parse(localStorage.getItem('demo_leads') || '[]');
  leads.push({
    contact: value,
    industry: currentIndustry,
    brand: industries[currentIndustry].brand,
    time: new Date().toISOString()
  });
  localStorage.setItem('demo_leads', JSON.stringify(leads));

  const formMsg = messages.find(m => m.form && !m.submitted);
  if (formMsg) formMsg.submitted = true;
  renderMessages();
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
}

function feedback(btn) {
  const parent = btn.parentElement;
  parent.querySelectorAll('.fb-btn').forEach(b => b.classList.remove('clicked'));
  btn.classList.add('clicked');
}

function autoResize(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 90) + 'px';
}

function handleKey(e) {
  // isComposing：中文输入法选词中的 Enter 不触发发送
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send();
  }
}

// 点击外部关闭抽屉
document.addEventListener('click', (e) => {
  const drawer = document.getElementById('drawer');
  const switchBtn = document.querySelector('.header-switch');
  if (!drawer.contains(e.target) && !switchBtn.contains(e.target)) {
    drawer.classList.remove('open');
  }
});

    const el = document.getElementById('messages');

  });
}

switchIndustry('pet');
